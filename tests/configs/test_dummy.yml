experiment_group: test
experiment_name: test_dummy_image
seed: 1

globals:
  INPUT_TYPE: image
  MODE: smm
  NUM_SLOTS: 7
  SLOT_DIM: 16
  FEAT_DIM: 768
  NUM_PATCHES: 256
  NUM_GPUS: 1
  BATCH_SIZE_PER_GPU: 64 # 128  
  TOTAL_BATCH_SIZE: "${mul: ${.NUM_GPUS}, ${.BATCH_SIZE_PER_GPU}}"
  BASE_LR: 0.0004 # [0.0004]
  STEP: null
  TEMPERATURE: 1.0 # [3.0]
  USED_MULTIPLES: []

trainer:
  max_steps: 100

optimizer:
  name: Adam
  lr: 3e-4

model:
  input_type: image
  visualize: false
  mode: ${globals.MODE}
  
  initializer:
    name: SMMInit
    n_slots: ${globals.NUM_SLOTS}
    dim: ${globals.SLOT_DIM}

  background_slot:
    use_background_slot: false
    feed_into_processor: true
    initializer:
      name: SMMInit  # FixedLearnedInit
      n_slots: 1
      dim: ${globals.SLOT_DIM}

  encoder:
    backbone:
      name: TimmExtractorv2
      model: vit_base_patch14_dinov2
      features:
      - vit_block12
      - vit_block11
      - vit_block10
      dim: ${globals.SLOT_DIM}
      drop: true
      mode: hc
      proj_type: nonlinear
      frozen: true
      pretrained: true
      last_blocks: 3
      model_kwargs:
        dynamic_img_size: True
    # output_transform:
    #   name: networks.two_layer_mlp
    #   inp_dim: ${globals.FEAT_DIM}
    #   outp_dim: ${globals.SLOT_DIM}
    #   hidden_dim: "${mul: ${globals.FEAT_DIM}, 4}"
    #   layer_norm: true

  grouper:
    name: StabilizedSMM
    dim: ${globals.SLOT_DIM}
    # hidden_dim: "${mul: ${globals.SLOT_DIM}, 2}"
    num_slots: ${globals.NUM_SLOTS}
    iters: 3
    # batch_size: ${globals.BATCH_SIZE_PER_GPU}
    attn_smooth: 'wnconv' # ['gaussian', 'conv', 'wnconv']
    attn_smooth_size: 5
    init_temperature: null
    temperature: ${globals.TEMPERATURE}
    final_temperature: null
    # kl_weight: 0.00004
    gau_min: 0.1 # 0.1 [2.0]
    gau_max: 2.0 # 2.0 [2.0]
    drop_rate: null # null
    step: ${globals.STEP}
    decay_steps: null # 100000
    used_multiples: ${globals.USED_MULTIPLES}
    # use_mlp: true
  # grouper:
  #   name: AdvancedBayesianSelfAttentionGMM
  #   dim: ${globals.SLOT_DIM}
  #   num_slots: ${globals.NUM_SLOTS}
  #   batch_size: ${globals.TOTAL_BATCH_SIZE}


  decoder:
    name: MLPDecoder
    inp_dim: ${globals.SLOT_DIM}
    outp_dim: ${globals.FEAT_DIM}
    hidden_dims: [2048, 2048, 2048]
    n_patches: ${globals.NUM_PATCHES}
    # final_conv: null # 'wnconv'
    # kernel_size: 5

val_metrics:
  ari:
    name: ImageARI
    ignore_background: true
    pred_key: decoder_masks_hard
    true_key: masks

dataset:
  name: DummyDataModule
  train_size: 20
  val_size: 5
  batch_size: 5
  train_transforms:
    name: dummyimage_train
    type: image
    input_size: 224
    num_classes: 4
  val_transforms:
    name: dummyimage_val
    type: image
    input_size: 224
    num_classes: 4
  shapes:
    image: [224, 224, 3]
    masks: [224, 224, 1]