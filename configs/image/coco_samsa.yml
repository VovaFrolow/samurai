experiment_group: samsa
experiment_name: coco_smm
seed: 1

globals:
  INPUT_TYPE: image
  MODE: samsa
  NUM_SLOTS: 7 # 7 [6]
  SLOT_DIM: 256 # 256
  VIT_MODEL: vit_base_patch14_dinov2
  FEAT_DIM: "${config_prop: VIT_PARAMS, ${.VIT_MODEL}, FEAT_DIM}"
  NUM_PATCHES: "${config_prop: VIT_PARAMS, ${.VIT_MODEL}, NUM_PATCHES}"
  NUM_GPUS: 1
  BATCH_SIZE_PER_GPU: 1 # 128  
  TOTAL_BATCH_SIZE: "${mul: ${.NUM_GPUS}, ${.BATCH_SIZE_PER_GPU}}"
  BASE_LR: 0.0004 # [0.0004]
  STEP: null
  TEMPERATURE: 1.0 # [3.0]
  USED_MULTIPLES: []

trainer:
  max_steps: 500000
  log_every_n_steps: 200
  val_check_interval: 2500
  gradient_clip_val: 1.0
  accumulate_grad_batches: 64

optimizer:
  name: Adam
  # Scale learning rate by batch size: 1e-4 for every 32 samples
  lr: "${eval: 'a / 32 * b', ${globals.TOTAL_BATCH_SIZE}, ${globals.BASE_LR}}" # "${eval: 'a / 32 * b', ${globals.TOTAL_BATCH_SIZE}, ${globals.BASE_LR}}"
  lr_scheduler:
    # name: exp_decay_with_warmup
    # warmup_steps: 10000
    # decay_steps: 100000
    # name: cosine_decay_with_warmup
    # warmup_steps: 5000
    # decay_steps: 45000
    # min_scale: 0.0025
    name: cosine_decay_with_exponential_tail
    warmup_steps: 5000
    decay_steps: 45000
    min_scale: 0.2
    exp_decay_rate: 0.65
    transition_start_ratio: 0.9
    transition_length_ratio: 0.1
    # name: cosine_annealing_with_warmup_and_restarts
    # warmup_steps: 5000
    # cycle_steps: 45000
    # restarts_factor: 2.0
    # decay_rate: 0.9
    # bench: 5000
    # min_scale: 0.25

model:
  input_type: ${globals.INPUT_TYPE}
  mode: ${globals.MODE}
  visualize: true
  visualize_every_n_steps: 2500
  load_weights: logs/rapid/2026-03-06-07-19-12_coco_base14_dinov2smm/checkpoints/step=141000.ckpt # "logs/rapid/2025-09-17-06-27-20_coco_base14_dinov2smm/checkpoints/step=82000.ckpt"
  masks_to_visualize: ['decoder', 'grouping', 'sam']
  
  # threshold_for_guidance_loss: 193
  losses:
    guidance_loss:
      name: CrossEntropyLoss
      pred_key: decoder.masks #_for_sam
      target_key: sam.sam_masks_hard
    # loss_featrec:
    #   name: MSELoss
    #   pred_dims:
    #     - 0
    #     - ${globals.FEAT_DIM}
  loss_weights:
    guidance_loss: 0.01
    # loss_featrec: 1.0

  sam:
    name: SAM
    sam_model_name: sam2.1_l.pt # sam2_l.pt
    use_box: True
    use_mask: False
    use_point: True
    refine_iters: 5
    in_mask_size: 16
    in_image_size: 224
    resize_mode: resize
    # threshold_for_points: 0.2
  
  initializer:
    name: SMMInit
    n_slots: ${globals.NUM_SLOTS}
    dim: ${globals.SLOT_DIM}
    # hidden_dim: "${mul: ${globals.SLOT_DIM}, 2}"

  encoder:
    backbone:
      name: TimmExtractorv2
      model: ${globals.VIT_MODEL}
      features:
      - vit_block12
      - vit_block11
      - vit_block10
      dim: ${globals.SLOT_DIM}
      drop: true
      mode: hc
      proj_type: nonlinear
      frozen: true
      pretrained: true
      last_blocks: 3
      model_kwargs:
        dynamic_img_size: True
    # output_transform:
    #   name: networks.two_layer_mlp
    #   inp_dim: ${globals.FEAT_DIM}
    #   outp_dim: ${globals.SLOT_DIM}
    #   hidden_dim: "${mul: ${globals.FEAT_DIM}, 4}"
    #   layer_norm: true

  grouper:
    name: StabilizedSMM
    dim: ${globals.SLOT_DIM}
    # hidden_dim: "${mul: ${globals.SLOT_DIM}, 2}"
    num_slots: ${globals.NUM_SLOTS}
    iters: 3
    # batch_size: ${globals.BATCH_SIZE_PER_GPU}
    attn_smooth: 'wnconv' # ['gaussian', 'conv', 'wnconv']
    attn_smooth_size: 5
    init_temperature: null
    temperature: ${globals.TEMPERATURE}
    final_temperature: null
    # kl_weight: 0.00004
    gau_min: 0.1 # 0.1 [2.0]
    gau_max: 2.0 # 2.0 [2.0]
    drop_rate: null # null
    step: ${globals.STEP}
    decay_steps: null # 100000
    used_multiples: ${globals.USED_MULTIPLES}
    # use_mlp: true
  # grouper:
  #   name: AdvancedBayesianSelfAttentionGMM
  #   dim: ${globals.SLOT_DIM}
  #   num_slots: ${globals.NUM_SLOTS}
  #   batch_size: ${globals.TOTAL_BATCH_SIZE}


  decoder:
    name: MLPDecoder
    inp_dim: ${globals.SLOT_DIM}
    outp_dim: ${globals.FEAT_DIM}
    hidden_dims: [2048, 2048, 2048]
    n_patches: ${globals.NUM_PATCHES}
    # final_conv: null # 'wnconv'
    # kernel_size: 5

val_metrics:
  ari:
    name: ImageARI
    ignore_overlaps: true
    pred_key: decoder_masks_hard
    true_key: segmentations
  fg_ari:
    name: ImageARI
    ignore_overlaps: true
    ignore_background: true
    pred_key: decoder_masks_hard
    true_key: segmentations
  mbo:
    name: ImageIoU
    ignore_overlaps: true
    matching: overlap
    pred_key: decoder_masks_hard
    true_key: segmentations
  miou:
    name: ImageIoU
    ignore_overlaps: true
    matching: hungarian
    pred_key: decoder_masks_hard
    true_key: segmentations
  # fg_miou:
  #   name: ImageIoU
  #   ignore_overlaps: true
  #   ignore_background: true
  #   matching: hungarian
  #   pred_key: decoder_masks_hard
  #   true_key: segmentations
  sam_ari:
    name: ImageARI
    ignore_overlaps: true
    pred_key: sam_masks_hard
    true_key: segmentations
  sam_fg_ari:
    name: ImageARI
    ignore_overlaps: true
    ignore_background: true
    pred_key: sam_masks_hard
    true_key: segmentations
  sam_mbo:
    name: ImageIoU
    ignore_overlaps: true
    matching: overlap
    pred_key: sam_masks_hard
    true_key: segmentations
  sam_miou:
    name: ImageIoU
    ignore_overlaps: true
    matching: hungarian
    pred_key: sam_masks_hard
    true_key: segmentations
  # sam_fg_miou:
  #   name: ImageIoU
  #   ignore_overlaps: true
  #   ignore_background: true
  #   matching: hungarian
  #   pred_key: sam_masks_hard
  #   true_key: segmentations
  slots_ari:
    name: ImageARI
    ignore_overlaps: true
    pred_key: grouping_masks_hard
    true_key: segmentations
  slots_fg_ari:
    name: ImageARI
    ignore_overlaps: true
    ignore_background: true
    pred_key: grouping_masks_hard
    true_key: segmentations
  slots_mbo:
    name: ImageIoU
    ignore_overlaps: true
    matching: overlap
    pred_key: grouping_masks_hard
    true_key: segmentations
  slots_miou:
    name: ImageIoU
    ignore_overlaps: true
    matching: hungarian
    pred_key: grouping_masks_hard
    true_key: segmentations
  # slots_fg_miou:
  #   name: ImageIoU
  #   ignore_overlaps: true
  #   ignore_background: true
  #   matching: hungarian
  #   pred_key: grouping_masks_hard
  #   true_key: segmentations

dataset:
  train_shards: "coco/coco-train-{000000..000924}.tar"
  val_shards: "coco/coco-validation-{000000..000039}.tar"
  batch_size: ${globals.BATCH_SIZE_PER_GPU}
  val_size: 5000
  # val_batch_size: 128
  num_workers: 4
  num_val_workers: 1
  train_pipeline:
    name: ${globals.INPUT_TYPE}
    keys: [image]
    is_video_dataset: false
    shuffle_size: 2048
    transforms:
      name: coco_train
      crop_type: short_side_resize_random
      type: ${globals.INPUT_TYPE}
      input_size: 224
      h_flip_prob: 0.5
  val_pipeline:
    name: ${globals.INPUT_TYPE}
    keys: [image, segmentations]
    is_video_dataset: false
    transforms:
      name: coco_val
      crop_type: central
      type: ${globals.INPUT_TYPE}
      input_size: 224
      num_classes: 63
